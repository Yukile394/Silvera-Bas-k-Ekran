name: Build Silvera Basık Ekran APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"
          cache-read-only: false

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f "./gradlew" ] || [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.6 --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Gradle configuration
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m"

      - name: Show build outputs on failure
        if: failure()
        run: |
          echo "===== Gradle build failed. Searching for logs ====="
          find . -name "*.log" -exec echo "--- {} ---" \; -exec cat {} \; || true

      - name: Locate generated APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK at: $APK_PATH"

      - name: Rename APK
        run: |
          mkdir -p app/build/outputs/apk/renamed
          cp "${{ steps.locate_apk.outputs.apk_path }}" app/build/outputs/apk/renamed/Silvera-Basik-Ekran.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Silvera-Basik-Ekran.apk
          path: app/build/outputs/apk/renamed/Silvera-Basik-Ekran.apk
          retention-days: 30
          if-no-files-found: error
